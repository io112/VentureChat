name: Release

on:
  push:
    tags: [ "v*" ]
  # Releases the dispatched commit and creates its tag, for when pushing a tag is not possible
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 3.8.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'

      - name: Resolve version from tag
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::${version} is not a version like 3.8.1 or 3.9.0-rc.1"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          # Only rc/alpha/beta/pre versions are pre-releases
          if [[ "$version" =~ -(rc|alpha|beta|pre) ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build with Maven
        run: mvn -B clean package "-Drevision=${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          flags=(--title "VentureChat ${VERSION}")
          # A tag push releases that tag; a manual run creates the tag on the dispatched commit
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then flags+=(--target "$GITHUB_SHA"); else flags+=(--verify-tag); fi
          # Hand-written notes in documentation/release-notes/<tag>.md win over generated ones
          notes="documentation/release-notes/${TAG}.md"
          if [[ -f "$notes" ]]; then flags+=(--notes-file "$notes"); else flags+=(--generate-notes); fi
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "target/VentureChat-${VERSION}.jar" "${flags[@]}"
