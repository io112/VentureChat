name: CI

# Push-only on purpose: a pull_request trigger would build our own branches twice, and filtering the
# duplicate out with a job-level `if` shows up as a "skipped" check on the PR.
# The default branch is built and published by dev-build.yml instead.
on:
  push:
    branches-ignore: [ "master" ]
    tags-ignore: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'

      - name: Compute dev version
        id: version
        shell: bash
        run: |
          base=$(mvn -B -q help:evaluate -Dexpression=revision -DforceStdout)
          version="${base}+${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Dev version: ${version}"

      - name: Build with Maven
        run: mvn -B clean package "-Drevision=${{ steps.version.outputs.version }}"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: VentureChat-${{ steps.version.outputs.version }}
          path: target/VentureChat-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 30
